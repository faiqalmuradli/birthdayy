<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎂 Pink Capybara Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #ffd9e6; }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,180,210,0.85);
            color: #8b2252;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ffe0ed, #ffc8d8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.8s;
        }
        #loading h1 { font-size: 2.5rem; color: #cc4477; margin-bottom: 10px; }
        #loading p  { color: #a0346a; font-size: 0.95rem; }
        #loading-bar-wrap {
            width: 220px; height: 8px;
            background: rgba(200,100,140,0.2);
            border-radius: 10px; margin-top: 20px; overflow: hidden;
        }
        #loading-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff77aa, #ff44aa);
            border-radius: 10px;
            transition: width 0.3s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="loading">
    <h1>🌸</h1>
    <p>Setting up your capybara room…</p>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<div id="info">🎂 Pink Capybara Room &nbsp;|&nbsp; Drag to look around</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffd9e6);
scene.fog = new THREE.FogExp2(0xffdaea, 0.012);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 1.6, 2.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = true;
controls.enablePan = true;
controls.rotateSpeed = 0.8;
controls.target.set(0, 0.5, 0);
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 1.8;
controls.update();

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffccdd, 1.0));

const sun = new THREE.DirectionalLight(0xfff0cc, 1.4);
sun.position.set(3, 6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = sun.shadow.camera.bottom = -5;
sun.shadow.camera.right = sun.shadow.camera.top = 5;
scene.add(sun);

const fill = new THREE.PointLight(0xff99bb, 0.8, 10);
fill.position.set(-2, 2, 2);
scene.add(fill);

const accent = new THREE.PointLight(0xffcc88, 0.5, 8);
accent.position.set(2, 1.5, -1);
scene.add(accent);

// ─── Room geometry (solid box slabs, visible from inside) ─────────────────────
const roomW = 6, roomH = 3.2, roomD = 6;
const T = 0.18; // wall thickness

function addSlab(w, h, d, x, y, z, color) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, side: THREE.BackSide })
    );
    mesh.position.set(x, y, z);
    mesh.receiveShadow = true;
    mesh.castShadow = false;
    scene.add(mesh);
    return mesh;
}

// Floor
addSlab(roomW, T, roomD,  0, -T/2,        0,        0xffb8ce);
// Ceiling
addSlab(roomW, T, roomD,  0, roomH + T/2, 0,        0xffe4f0);
// Back wall
addSlab(roomW, roomH, T,  0, roomH/2, -roomD/2,     0xffd0e8);
// Left wall
addSlab(T, roomH, roomD, -roomW/2, roomH/2, 0,      0xffd8ec);
// Right wall
addSlab(T, roomH, roomD,  roomW/2, roomH/2, 0,      0xffd8ec);

// Rug
const rug = new THREE.Mesh(
    new THREE.CircleGeometry(1.4, 64),
    new THREE.MeshStandardMaterial({ color: 0xff90bb, roughness: 0.9 })
);
rug.rotation.x = -Math.PI / 2;
rug.position.y = 0.002;
rug.receiveShadow = true;
scene.add(rug);

// ─── Balloons ─────────────────────────────────────────────────────────────────
const balloonColors = [0xff6699, 0xff99cc, 0xffaadd, 0xff4488, 0xffbbee, 0xdd55aa];

function makeBalloon(x, y, z, color) {
    const group = new THREE.Group();

    // Balloon body (slightly taller sphere)
    const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 16, 16),
        new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.05 })
    );
    body.scale.y = 1.25;
    body.castShadow = true;
    group.add(body);

    // Knot (tiny sphere at bottom)
    const knot = new THREE.Mesh(
        new THREE.SphereGeometry(0.022, 8, 8),
        new THREE.MeshStandardMaterial({ color })
    );
    knot.position.y = -0.165;
    group.add(knot);

    // String — CatmullRomCurve gives a natural droop
    const stringDrop = 0.35 + Math.random() * 0.2;
    const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, -0.165, 0),
        new THREE.Vector3(Math.random()*0.06 - 0.03, -0.165 - stringDrop * 0.5, Math.random()*0.04),
        new THREE.Vector3(0, -0.165 - stringDrop, 0)
    ]);
    const stringGeo = new THREE.TubeGeometry(curve, 12, 0.004, 4, false);
    const string = new THREE.Mesh(stringGeo,
        new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 1 }));
    group.add(string);

    group.position.set(x, y, z);
    scene.add(group);
    return group;
}

// Back-left corner cluster
makeBalloon(-1.8, 1.8, -2.6, balloonColors[0]);
makeBalloon(-1.45, 2.0, -2.6, balloonColors[1]);
makeBalloon(-1.65, 2.2, -2.6, balloonColors[2]);
// Back-right corner cluster
makeBalloon( 1.8, 1.8, -2.6, balloonColors[3]);
makeBalloon( 1.45, 2.0, -2.6, balloonColors[4]);
makeBalloon( 1.65, 2.2, -2.6, balloonColors[5]);

// Front-left corner cluster
makeBalloon(-1.8, 1.8,  2.4, balloonColors[2]);
makeBalloon(-1.5, 2.0,  2.4, balloonColors[5]);
makeBalloon(-1.65, 2.2, 2.4, balloonColors[0]);
// Front-right corner cluster
makeBalloon( 1.8, 1.8,  2.4, balloonColors[3]);
makeBalloon( 1.5, 2.0,  2.4, balloonColors[1]);
makeBalloon( 1.65, 2.2, 2.4, balloonColors[4]);

// Left-wall mid cluster
makeBalloon(-2.5, 1.7, -0.6, balloonColors[0]);
makeBalloon(-2.5, 1.9, -0.3, balloonColors[5]);
makeBalloon(-2.5, 2.1,  0.0, balloonColors[2]);
// Right-wall mid cluster
makeBalloon( 2.5, 1.7, -0.6, balloonColors[3]);
makeBalloon( 2.5, 1.9, -0.3, balloonColors[1]);
makeBalloon( 2.5, 2.1,  0.0, balloonColors[4]);

// Front wall ribbon
makeBalloon(-0.8, 1.8,  2.6, balloonColors[4]);
makeBalloon(-0.2, 2.0,  2.6, balloonColors[0]);
makeBalloon( 0.4, 1.8,  2.6, balloonColors[2]);
makeBalloon( 1.0, 2.0,  2.6, balloonColors[5]);

// Around the cake (table center is x:0, z:-0.2)
makeBalloon(-0.5, 1.6, -0.2, balloonColors[1]);
makeBalloon( 0.5, 1.6, -0.2, balloonColors[3]);
makeBalloon( 0.0, 1.7,  0.3, balloonColors[0]);
makeBalloon( 0.0, 1.7, -0.7, balloonColors[4]);
makeBalloon(-0.4, 1.65, 0.1, balloonColors[2]);
makeBalloon( 0.4, 1.65,-0.5, balloonColors[5]);

// Loose drifters nearby
makeBalloon(-1.1, 1.75,  0.8, balloonColors[1]);
makeBalloon( 1.2, 1.9,   0.5, balloonColors[0]);
makeBalloon( 0.1, 1.8,  -1.0, balloonColors[3]);
makeBalloon(-0.7, 1.7,  -1.4, balloonColors[5]);

// ─── Wall flowers (simple, on back wall) ──────────────────────────────────────
function makeFlower(r, g, b) {
    const group = new THREE.Group();
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x6b8e23 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.15, 6), stemMat);
    stem.position.y = 0.075;
    group.add(stem);
    const petalMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(r, g, b) });
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), petalMat);
        p.position.set(Math.cos(a) * 0.07, 0.15, Math.sin(a) * 0.07);
        group.add(p);
    }
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xffcc66 }));
    center.position.y = 0.15;
    group.add(center);
    return group;
}

// Floor flowers along the edges
[[-2.2,-2.0],[-0.6,-2.5],[0.8,-2.4],[2.1,-1.9],[-2.4,-0.3],[2.3,-0.5]].forEach(([x, z]) => {
    const f = makeFlower(1, 0.65, 0.8);
    f.position.set(x, 0, z);
    scene.add(f);
});

// ─── Floating particles ────────────────────────────────────────────────────────
function makeParticles(count, color, size) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        pos[i*3]   = (Math.random() - 0.5) * 4;
        pos[i*3+1] = Math.random() * 2.5;
        pos[i*3+2] = (Math.random() - 0.5) * 4;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(geo,
        new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.55 }));
}
const hearts = makeParticles(80, 0xff55aa, 0.032);
const petals = makeParticles(120, 0xffaacc, 0.022);
scene.add(hearts, petals);

// ─── *** SAFE MODEL LOADER *** ─────────────────────────────────────────────────
// Auto-normalizes every GLB to a target size using a bounding box.
// This is crash-safe: no matter how huge the source GLB is, it will be shrunk.
const gltfLoader = new GLTFLoader();

let totalModels = 0, loadedModels = 0;
const loadingBar = document.getElementById('loading-bar');
const loadingEl  = document.getElementById('loading');

function updateBar() {
    loadingBar.style.width = `${(loadedModels / Math.max(totalModels, 1)) * 100}%`;
    if (loadedModels >= totalModels) {
        setTimeout(() => loadingEl.classList.add('hidden'), 600);
    }
}

/**
 * Load a GLB and fit it so its longest axis equals `targetSize`.
 * This is 100% crash-safe — the GLB can be any scale internally.
 *
 * @param {string}   path        - e.g. './models/capybara.glb'
 * @param {object}   position    - { x, y, z } in world units
 * @param {number}   targetSize  - desired longest dimension in metres
 * @param {object}   rotation    - { x, y, z } Euler radians
 * @param {Function} [onLoad]    - optional callback(model)
 */
function loadNormalized(path, position, targetSize, rotation = {x:0,y:0,z:0}, onLoad) {
    totalModels++;
    updateBar();

    gltfLoader.load(path, (gltf) => {
        const model = gltf.scene;

        // --- Compute bounding box in the GLB's own coordinate space ---
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        // Avoid divide-by-zero for empty/broken models
        const scaleFactor = maxDim > 0 ? targetSize / maxDim : 1;
        model.scale.setScalar(scaleFactor);

        // Re-center so the bottom of the model sits at Y = position.y
        const box2 = new THREE.Box3().setFromObject(model);
        model.position.set(
            position.x - (box2.min.x + box2.max.x) / 2 * 0,   // keep x as-is after scale
            position.y - box2.min.y,                            // sit on floor/table
            position.z
        );
        // Correct X centering
        const center = new THREE.Vector3();
        box2.getCenter(center);
        model.position.x = position.x - (center.x - model.position.x);

        model.rotation.set(rotation.x, rotation.y, rotation.z);

        model.traverse(child => {
            if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
        });

        scene.add(model);
        if (onLoad) onLoad(model);

        loadedModels++;
        updateBar();
        console.log(`✅ ${path} → scale ${scaleFactor.toFixed(5)} (fit to ${targetSize}m)`);

    }, undefined, (err) => {
        console.error(`❌ Failed: ${path}`, err);
        loadedModels++;
        updateBar();
    });
}

// ─── Load your models ─────────────────────────────────────────────────────────
// Load table first → measure its actual top surface → place cake & frames on it

loadNormalized('./models/table.glb',
    { x: 0, y: 0, z: -0.2 },
    0.85,
    { x: 0, y: 0, z: 0 },
    (tableModel) => {
        // Measure the real top of the table after normalisation
        const tableBox = new THREE.Box3().setFromObject(tableModel);
        const tableTop = tableBox.max.y;  // actual top surface Y in world space
        console.log('Table top Y:', tableTop);

        // Cake sits exactly on the table top surface
        loadNormalized('./models/fo3_birthday_cake.glb',
            { x: 0, y: tableTop, z: -0.2 },
            0.45,   
            { x: 0, y: 0, z: 0 }
        );

        // Picture frames also on table top, slightly behind cake
        loadNormalized('./picture_frame.glb',
            { x: -0.30, y: tableTop, z: -0.42 },
            0.28,
            { x: 0, y: 0.25, z: 0 }
        );
        loadNormalized('./models/picture_frame.glb',
            { x:  0.30, y: tableTop, z: -0.42 },
            0.28,
            { x: 0, y: -0.25, z: 0 }
        );
    }
);

// Capybaras: perfect circle of 6 around the table, all facing inward
const capyCount = 6;
const circleR = 0.9;                    // wider circle around the table
const tableCenter = { x: 0, z: -0.2 };
const startAngle = 0;                   // clean start, perfectly even

for (let i = 0; i < capyCount; i++) {
    const angle = startAngle + (i / capyCount) * Math.PI * 2;
    const cx = tableCenter.x + Math.cos(angle) * circleR;
    const cz = tableCenter.z + Math.sin(angle) * circleR;

    const faceAngle = Math.atan2(tableCenter.x - cx, tableCenter.z - cz);

    loadNormalized('./models/samurai_capybara.glb',
        { x: cx, y: 0, z: cz },
        0.6,
        { x: 0, y: faceAngle, z: 0 },
        (model) => {
    model.traverse(child => {
        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
                child.material.roughness = 0.85;
                child.material.metalness = 0.2;
                child.material.needsUpdate = true;
            }
        }
    });
}
    );
}

// ─── Animate ──────────────────────────────────────────────────────────────────
let t = 0;
function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    hearts.rotation.y = Math.sin(t * 0.18) * 0.12;
    petals.rotation.x = Math.sin(t * 0.13) * 0.06;

    // Gently bob the fill light
    fill.position.y = 2 + Math.sin(t * 0.4) * 0.2;

    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
